name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - mobile

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # The media pack is bundled into the APK, so the full media tree has
      # to be checked out here.
      - name: Checkout with media pack
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*

      # Capacitor CLI 8 hard-requires Node >= 22, so Node 20 cannot be used here.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8's Android library compiles with source/target 21, so the
      # JDK must be 21 or newer (JDK 17 fails with "invalid source release: 21").
      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK and install platform packages
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (media stripped)
        run: npm run build:mobile

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Put the media pack into the APK's assets so the app never needs a
      # manual 600 MB push. See scripts/bundle-media-pack.mjs.
      - name: Bundle media pack into the APK assets
        run: node scripts/bundle-media-pack.mjs

      # Guard rail: unpack the pack with the very class the app uses. A
      # pack that is not a real ZIP (the `tar -a` trap) makes ZipFile throw,
      # the app then shows no illustrations and no audio while the build
      # looks perfectly green.
      - name: Verify the media pack can actually be unpacked
        run: |
          mkdir -p build/packcheck
          javac -encoding UTF-8 -d build/packcheck \
            android/app/src/main/java/com/haoxin/wordatlas/AtlasExtractor.java \
            tools/atlas/PackTest.java
          java -cp build/packcheck PackTest \
            android/app/src/main/assets/atlas.zip \
            build/packcheck/media

      # Safety net: the stable debug keystore must exist, otherwise every
      # build would be signed differently and reinstalling the app would wipe
      # the user's 600 MB media pack.
      - name: Ensure debug keystore is present
        run: |
          if [ ! -f android-debug.keystore ]; then
            echo "::error::android-debug.keystore is missing from the checkout"
            exit 1
          fi
          ls -l android-debug.keystore

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: word-atlas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the APK as a release asset so it can be downloaded directly
      # from a stable URL without signing in.
      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-debug-${{ github.run_number }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create "$TAG" \
              android/app/build/outputs/apk/debug/app-debug.apk \
              --title "WordAtlas debug APK (build ${{ github.run_number }})" \
              --notes "Automated debug build. The offline media pack (illustrations + audio) is bundled into the APK; the app unpacks it on first launch. No manual file transfer needed."
          fi
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/app-debug.apk"

      # Optional release build: add a keystore as a repository secret
      # (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
      #  ANDROID_KEY_PASSWORD), then uncomment the steps below.
      #
      # - name: Decode keystore
      #   run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      # - name: Assemble release APK
      #   working-directory: android
      #   run: ./gradlew assembleRelease --no-daemon
      # - name: Upload app-release.apk
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: word-atlas-release-apk
      #     path: android/app/build/outputs/apk/release/app-release.apk
